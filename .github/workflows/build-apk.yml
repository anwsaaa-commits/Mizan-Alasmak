name: Build Mizan Al Asmak APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true
      - name: Download Arabic PDF font
        run: |
          mkdir -p assets/fonts
          curl -L --fail --retry 3 "https://raw.githubusercontent.com/notofonts/notofonts.github.io/main/fonts/NotoSansArabic/hinted/ttf/NotoSansArabic-Regular.ttf" -o assets/fonts/NotoSansArabic.ttf
      - name: Generate Android project files
        run: flutter create . --org com.alshaheen --project-name mizan_alasmak --platforms=android --no-pub
      - name: Get dependencies
        run: flutter pub get
      - name: Format Dart source
        run: dart format lib
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mizan-alasmak-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
